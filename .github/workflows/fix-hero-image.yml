name: Fix hero image crop

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix hero image crop automatically'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Preserve full hero image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '.hero-media img{width:100%;height:530px;object-fit:cover;border-radius:30px;display:block;box-shadow:0 25px 70px #071a3324}'
          new = '.hero-media img{width:100%;height:auto;aspect-ratio:1000/650;object-fit:contain;border-radius:30px;display:block;box-shadow:0 25px 70px #071a3324;background:#071a33}'
          if old not in s:
              raise SystemExit('hero CSS pattern not found')
          p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix hero image crop automatically'
          git push
