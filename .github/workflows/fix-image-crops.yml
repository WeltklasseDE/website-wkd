name: Fix image crops

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix website image crops automatically'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix section image crop and use full source images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          replacements = {
            'https://static.wixstatic.com/media/9fe9c1_d7fc711710924a36ab3fa237405369f8f000.jpg/v1/fill/w_1000,h_650,al_c,q_80,enc_avif,quality_auto/9fe9c1_d7fc711710924a36ab3fa237405369f8f000.jpg':
            'https://static.wixstatic.com/media/9fe9c1_d7fc711710924a36ab3fa237405369f8f000.jpg',
            'https://static.wixstatic.com/media/9fe9c1_6ba2495130f6485daa7ec2635e455153~mv2.jpg/v1/fill/w_1000,h_650,al_c,q_80,enc_avif,quality_auto/Logo%20von%20Men%C3%BC%20%28650%20x%20350%20px%29.jpg':
            'https://static.wixstatic.com/media/9fe9c1_6ba2495130f6485daa7ec2635e455153~mv2.jpg',
            'https://static.wixstatic.com/media/9fe9c1_357db54d909241cab0e2fab40ffd292d~mv2.jpg/v1/fill/w_700,h_700,al_c,q_80,enc_avif,quality_auto/Design%20ohne%20Titel%20%2817%29.jpg':
            'https://static.wixstatic.com/media/9fe9c1_357db54d909241cab0e2fab40ffd292d~mv2.jpg'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          old_css = '.split img{width:100%;height:auto;max-height:520px;object-fit:contain;border-radius:28px;display:block;background:#fff}'
          new_css = '.split img{width:100%;height:auto;max-height:none;object-fit:contain;border-radius:28px;display:block;background:#fff}'
          s = s.replace(old_css, new_css)

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix website image crops automatically'
          git push
